apply plugin: 'com.android.application'

android {
    namespace = "com.aiind.app"
    compileSdk = rootProject.ext.compileSdkVersion

    signingConfigs {
release {
storeFile file(System.getProperty("user.home") + "/Ai.Ind/aiind-release-key.jks")
storePassword "AiInd@2026!Release"
keyAlias "aiind"
keyPassword "AiInd@2026!Release"
}
}

    defaultConfig {
        applicationId "com.aiind.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*.swp:'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    implementation "com.google.android.gms:play-services-ads:24.5.0"
}


apply from: '../capacitor-cordova-android-plugins/cordova.variables.gradle'

if (project.hasProperty('postBuildExtras')) {
    postBuildExtras()
}
