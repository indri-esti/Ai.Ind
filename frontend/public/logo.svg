<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="100%" stop-color="#07111D"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18D8FF"/>
      <stop offset="100%" stop-color="#008FE8"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect
    width="512"
    height="512"
    rx="110"
    fill="url(#bg)"
  />

  <!-- Soft circular glow -->
  <circle
    cx="256"
    cy="256"
    r="170"
    fill="#00C2FF"
    opacity="0.06"
  />

  <circle
    cx="256"
    cy="256"
    r="135"
    fill="#00C2FF"
    opacity="0.04"
  />

  <!-- Robot antenna -->
  <rect
    x="244"
    y="105"
    width="24"
    height="42"
    rx="12"
    fill="url(#cyan)"
  />

  <circle
    cx="256"
    cy="98"
    r="9"
    fill="#18D8FF"
    filter="url(#glow)"
  />

  <!-- Robot head -->
  <rect
    x="137"
    y="145"
    width="238"
    height="190"
    rx="58"
    fill="url(#cyan)"
  />

  <!-- Left ear -->
  <rect
    x="112"
    y="195"
    width="25"
    height="75"
    rx="12"
    fill="#11BCEB"
  />

  <!-- Right ear -->
  <rect
    x="375"
    y="195"
    width="25"
    height="75"
    rx="12"
    fill="#11BCEB"
  />

  <!-- Inner face -->
  <rect
    x="153"
    y="161"
    width="206"
    height="158"
    rx="45"
    fill="#0B1B2B"
    opacity="0.18"
  />

  <!-- Left eye -->
  <circle
    cx="207"
    cy="225"
    r="18"
    fill="#07111D"
  />

  <!-- Right eye -->
  <circle
    cx="305"
    cy="225"
    r="18"
    fill="#07111D"
  />

  <!-- Mouth -->
  <rect
    x="207"
    y="271"
    width="98"
    height="13"
    rx="6.5"
    fill="#07111D"
  />

  <!-- Small center detail -->
  <circle
    cx="256"
    cy="205"
    r="5"
    fill="#FFFFFF"
    opacity="0.25"
  />

  <!-- Bottom accent -->
  <path
    d="M190 365
       C190 345 206 332 226 332
       H286
       C306 332 322 345 322 365
       V382
       H190Z"
    fill="url(#cyan)"
    opacity="0.9"
  />

  <!-- Subtle bottom highlight -->
  <path
    d="M214 355 H298"
    stroke="#FFFFFF"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.2"
  />
</svg>